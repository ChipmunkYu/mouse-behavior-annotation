[alembic]
# Migration scripts directory (relative to this file)
script_location = migrations
# Allow env.py to import the `app` package (env.py also inserts backend/ into sys.path)
prepend_sys_path = .
path_separator = os

# Database URL: injected at runtime by scripts/migrate.py / app.migration.
# This value is only used when running `alembic upgrade head` directly.
sqlalchemy.url = sqlite:///./data/annotation.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
